name: Feature request
description: Describe a workflow improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and compatibility considerations
      description: Note any new filesystem access, network calls or effect on existing package groups.
