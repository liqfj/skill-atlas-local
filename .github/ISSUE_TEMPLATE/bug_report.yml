name: Bug report
description: Report a reproducible problem using sanitized examples.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not attach personal catalogs, skill documents, local configuration, access tokens or private paths. Report vulnerabilities through the private channel described in SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Skill Atlas version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, Node.js and browser versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use fictional skills and anonymized directory names.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private data, paths and credentials from this report.
          required: true
